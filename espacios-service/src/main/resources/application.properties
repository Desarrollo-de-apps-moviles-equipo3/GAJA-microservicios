spring.application.name=espacios-service
server.port=${PORT:8081}

# Supabase (PostgreSQL). Los valores salen de variables de entorno: nunca se escriben aqui.
spring.datasource.url=${SUPABASE_DB_URL}
spring.datasource.username=${SUPABASE_DB_USER}
spring.datasource.password=${SUPABASE_DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=3

# Las tablas de este servicio viven en su propio esquema (ver sql/schema.sql)
spring.jpa.properties.hibernate.default_schema=${DB_SCHEMA:espacios}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
