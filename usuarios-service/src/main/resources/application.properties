spring.application.name=usuarios-service
server.port=${PORT:8081}

# Supabase (PostgreSQL). Los valores salen de variables de entorno: nunca se escriben aqui.
spring.datasource.url=${SUPABASE_DB_URL}
spring.datasource.username=${SUPABASE_DB_USER}
spring.datasource.password=${SUPABASE_DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=3

# Las tablas de este servicio viven en su propio esquema (ver sql/schema.sql)
spring.jpa.properties.hibernate.default_schema=${DB_SCHEMA:usuarios}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Seguridad: clave para firmar y validar los tokens (minimo 32 caracteres).
# Debe ser LA MISMA en usuarios, espacios y reservas. Nunca se escribe aqui: solo variable de entorno.
jwt.secret=${JWT_SECRET}
jwt.expiration-hours=${JWT_EXPIRATION_HOURS:12}

# Bloqueo por intentos fallidos (valores por defecto: 5 intentos, 15 minutos)
seguridad.login.max-intentos=${LOGIN_MAX_INTENTOS:5}
seguridad.login.bloqueo-minutos=${LOGIN_BLOQUEO_MINUTOS:15}

# Correo para recuperar contraseña (API HTTP de Brevo; Render gratis bloquea SMTP). Sin estas variables
# el servicio funciona igual, pero no envía correos.
gaja.mail.api-key=${BREVO_API_KEY:}
gaja.mail.from=${MAIL_FROM:}
gaja.mail.from-name=${MAIL_FROM_NAME:GAJA}
gaja.mail.mostrar-codigo-en-log=${MAIL_CODIGO_EN_LOG:false}
